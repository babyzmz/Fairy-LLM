[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[project]
name = "fairy-capabilities"
version = "0.1.0"
description = "Replaceable provider adapters and local composition for Fairy V3"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fairy-core",
  "httpx>=0.28,<0.29",
  "pypdf>=6.14.2,<6.15",
  "python-docx>=1.2,<1.3",
  "tzdata>=2026.1,<2027",
]

[tool.uv.sources]
fairy-core = { path = "../core", editable = true }

[dependency-groups]
dev = [
  "pytest>=9.1,<10",
  "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"
