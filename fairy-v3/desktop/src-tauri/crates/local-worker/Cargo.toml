[package]
name = "fairy-local-worker"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
mime_guess = "2.0"
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tiny_http = "0.12"
url = "2.5"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
