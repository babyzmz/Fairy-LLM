[workspace]
members = ["crates/core-bridge", "crates/local-worker"]
resolver = "2"

[package]
name = "fairy-desktop-v3"
version = "0.2.0"
description = "Windows-first desktop shell for Fairy V3"
authors = ["Fairy"]
edition = "2021"
autobins = false

[[bin]]
name = "fairy"
path = "src/main.rs"

[lib]
name = "fairy_desktop_v3"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "=0.22.1"
fairy-core-bridge = { path = "crates/core-bridge" }
fairy-local-worker = { path = "crates/local-worker" }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-dialog = { version = "=2.7.1", default-features = false }
thiserror = "=2.0.18"

[target.'cfg(target_os = "windows")'.dependencies]
xcap = { version = "=0.9.6", default-features = false }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Power", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
