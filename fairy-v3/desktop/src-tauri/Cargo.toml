[workspace]
members = [
    "crates/core-bridge",
    "crates/local-worker",
    "crates/realtime-worker",
    "crates/windows-capture-dda",
]
resolver = "2"

[package]
name = "fairy-desktop-v3"
version = "0.2.0"
description = "Windows-first desktop shell for Fairy V3"
authors = ["Fairy"]
edition = "2021"
autobins = false
default-run = "fairy"

[[bin]]
name = "fairy"
path = "src/main.rs"

[[bin]]
name = "presence-dda-probe"
path = "src/bin/presence_dda_probe.rs"

[lib]
name = "fairy_desktop_v3"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "=0.22.1"
fairy-core-bridge = { path = "crates/core-bridge" }
fairy-local-worker = { path = "crates/local-worker" }
fairy-realtime-worker = { path = "crates/realtime-worker" }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-dialog = { version = "=2.7.1", default-features = false }
thiserror = "=2.0.18"
uuid = { version = "=1.23.4", features = ["v4"] }
zeroize = "=1.8.2"

[target.'cfg(target_os = "windows")'.dependencies]
fairy-windows-capture-dda = { path = "crates/windows-capture-dda" }
windows = { version = "=0.62.2", features = ["Foundation", "Foundation_Numerics", "System", "UI_Composition", "UI_Composition_Desktop", "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Direct3D11", "Win32_Graphics_DirectComposition", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Variant", "Win32_System_WinRT", "Win32_System_WinRT_Composition", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-numerics = "=0.3.1"
xcap = { version = "=0.9.6", default-features = false }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"
