[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[project]
name = "fairy-cloud"
version = "0.1.0"
description = "Cloud adapters and deployment composition for Fairy V3"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.18,<2",
  "asyncpg>=0.31,<1",
  "boto3>=1.42,<2",
  "fairy-core",
  "fastapi>=0.139,<0.140",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.3.4,<4",
  "pyjwt[crypto]>=2.11,<3",
  "pydantic-settings>=2.12,<3",
  "sqlalchemy>=2.0.51,<2.1",
  "uvicorn[standard]>=0.51,<0.52",
]

[tool.uv.sources]
fairy-core = { path = "../core", editable = true }

[dependency-groups]
dev = [
  "pyyaml>=6.0.3,<7",
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "strict"
testpaths = ["tests"]
markers = ["integration: requires the Docker Compose PostgreSQL and S3 services"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"
