[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[project]
name = "fairy-core"
version = "0.1.0"
description = "Transport-independent core for Fairy V3"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "aiosqlite>=0.22,<1",
  "alembic>=1.18,<2",
  "asyncpg>=0.31,<1",
  "fastapi>=0.139,<0.140",
  "httpx>=0.28,<1",
  "pydantic>=2.13,<3",
  "sqlalchemy>=2.0.51,<2.1",
  "uvicorn[standard]>=0.51,<0.52",
]

[dependency-groups]
dev = [
  "hypothesis>=6.156,<7",
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"
