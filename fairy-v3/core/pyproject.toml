[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[project]
name = "fairy-core"
version = "0.1.0"
description = "Transport-independent core for Fairy V3"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.18.5,<1.19",
  "cryptography>=46,<50",
  "httpx>=0.28.1,<0.29",
  "mcp>=1.28.1,<2",
  "pydantic>=2.13,<3",
  "pyyaml>=6.0.3,<7",
  "sqlalchemy>=2.0.51,<2.1",
  "tzdata>=2025.3",
]

[project.scripts]
fairy-agent-eval = "fairy_core.evals.__main__:main"

[dependency-groups]
dev = [
  "hypothesis>=6.156,<7",
  "pytest>=9.1,<10",
  "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"
