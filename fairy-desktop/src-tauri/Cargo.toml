[package]
name = "fairy-desktop"
version = "0.1.0"
description = "Minimal Tauri shell for Fairy"
authors = ["Fairy"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[features]
default = []
